responses:

  
  utter_bienvenue:
    - text: "Bonjour, bienvenue chez Taysir Microfinance."


  
  utter_demander_prenom:
    - text: "Quel est votre prénom ?"

  utter_demander_telephone:
    - text: "Quel est votre numéro de téléphone ?"

  utter_demander_age:
    - text: "Quel est votre âge ?"

  utter_demander_profession:
    - text: "Quelle est votre situation professionnelle ?"

  utter_demander_revenu:
    - text: "Quel est votre revenu mensuel ?"

  utter_demander_montant:
    - text: "Quel montant de financement souhaitez-vous ?"

  utter_demander_charges:
    - text: "Quelles sont vos charges mensuelles approximatives ?"

  utter_demander_zone:
    - text: "Dans quelle zone géographique habitez-vous ?"


 
  utter_analyse:
    - text: "Merci pour toutes vos informations. Votre profil va maintenant être évalué."



  utter_faq_financement:
    - text: "Taysir propose différents types de financements adaptés aux besoins des clients. Cette information sera précisée après validation par mon encadrant."

  utter_faq_eligibilite:
    - text: "L'éligibilité dépend notamment du profil du demandeur, de sa situation professionnelle et de sa capacité de remboursement."

  utter_faq_documents:
    - text: "Les documents nécessaires dépendent du type de financement et de la situation du demandeur."

  utter_faq_montant:
    - text: "Le montant de financement dépend du profil du demandeur, de son besoin et de sa capacité de remboursement."

  utter_faq_remboursement:
    - text: "Le remboursement s'effectue selon un échéancier défini en fonction des conditions du financement."

  utter_faq_delai:
    - text: "Le délai de traitement dépend de la demande et de la vérification des informations fournies."

  utter_faq_conditions:
    - text: "Les conditions dépendent du produit de financement et du profil du demandeur."

  utter_faq_agence:
    - text: "Vous pouvez contacter Taysir afin de connaître l'agence la plus proche de votre zone."

  utter_faq_contact:
    - text: "Vous pouvez contacter Taysir via ses canaux de communication officiels."

  utter_faq_frais:
    - text: "Les frais dépendent du produit de financement et des conditions applicables."

  utter_faq_demande:
    - text: "Pour commencer une demande, le chatbot peut recueillir vos informations et effectuer une première évaluation de votre profil."

  utter_faq_simulation:
    - text: "Une première évaluation peut être réalisée à partir de vos revenus, charges et besoin de financement."


actions:
  - action_initialiser_etat
  - action_traiter_reponse
  - action_evaluer_prospect
